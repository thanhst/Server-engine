# ServerEngine runtime configuration.

[log]
level=debug
console=true
file=logs/serverengine.log
append=true

[server]
transport=tcp
tcp_backend=iocp
host=0.0.0.0
port=8080
workers=4
max_sessions=10000
max_message_bytes=65536
idle_timeout_ms=300000
receive_timeout_ms=1000
tcp_no_delay=true

[access]
require_auth=true
token=secret

[security]
mode=token
ecc_p256_provider_check=true

[storage]
enabled=false
provider=postgresql
connection_string=
pool_size=16

[distribution]
enabled=false
node_id=node-1
advertised_endpoint=127.0.0.1:8080
seed_nodes=
