# ServerEngine runtime configuration.

[log]
level=debug
console=true
file=logs/serverengine.log
append=true

[server]
transport=tcp
tcp_backend=iocp
host=0.0.0.0
port=8080
workers=4
max_sessions=10000
# Per line before LF; includes CR when using CRLF. A larger line disconnects.
max_message_bytes=65536
idle_timeout_ms=300000
receive_timeout_ms=1000
tcp_no_delay=true

[access]
require_auth=true
token=secret

[security]
# This setting does not enable TLS. ECC handshake is not implemented.
mode=token
ecc_p256_provider_check=true

[storage]
# Reserved settings: no storage driver is implemented yet.
enabled=false
provider=postgresql
connection_string=
pool_size=16

[distribution]
# Reserved settings: no cluster/discovery implementation yet.
enabled=false
node_id=node-1
advertised_endpoint=127.0.0.1:8080
seed_nodes=
